name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pagesへのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# 進行中のデプロイは中断せず、後続をまとめる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 依存関係のインストール
        working-directory: web
        run: npm ci

      - name: ゲームロジックのテスト
        working-directory: web
        run: npm test

      - name: シナリオ定義の検証
        working-directory: web
        run: npm run validate:scenarios:strict

      - name: E2E用Chromiumをインストール
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: ブラウザスモークテスト
        working-directory: web
        run: npm run test:e2e

      - name: 配信パスを決める
        id: base
        # ユーザー/組織ページ(<name>.github.io)は "/"、
        # プロジェクトページは "/<リポジトリ名>/" 配下に置かれる
        run: |
          if [[ "${{ github.event.repository.name }}" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
            echo "url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: ビルド
        working-directory: web
        env:
          VITE_BASE: ${{ steps.base.outputs.path }}
          VITE_PUBLIC_GAME_URL: ${{ steps.base.outputs.url }}
        run: npm run build

      - name: Jekyll処理を無効化
        run: touch web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
